interface:
  display_name: "トレカ海外販売・需要と参考再現"
  short_description: "現在の需要・買う理由・DM導線を設計し、参考の全画像・全動画を分解して制作と比較検品"
  default_prompt: "$tcg-social-studio を使い、最初に $tcg-social-intake で案件の前提・根拠・操作範囲を記録し、その後、現在の需要と買い手の得を確認して商品を選び、台帳の参考を全枚・全編で分析し、画像または動画と英日本文を制作してください。Museから参考の全素材と根拠を受け取り、全ページ・全時間の比較と完成判定まで行ってください。"
