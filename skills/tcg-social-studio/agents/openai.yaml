interface:
  display_name: "トレカ海外販売・毎日の投稿づくり"
  short_description: "毎日3案（リール・カルーセル・画像）を、調査から制作・英日の文章・検品・表への記入まで質問せずに進め、人がチェックした案だけを投稿する"
  default_prompt: "$tcg-social-studio を使い、client.json を読んで、今日の3案を調査から表への記入まで進めてください。途中で質問せず、迷った点は自分で決めて理由を表に書いてください。表の「投稿OK」にチェックが付いた行は投稿の許可です。決まった時刻に表を見て、チェックの付いた行だけを投稿してください。"
