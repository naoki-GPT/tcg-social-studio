interface:
  display_name: "トレカ海外販売・毎日の投稿づくり"
  short_description: "毎日、その日の動きを調べてネタを出し、選ばれた案（リール・カルーセル・画像）を制作・英日の文章・検品・表への記入まで進め、人がチェックした案だけを投稿する"
  default_prompt: "$tcg-social-studio を使い、client.json を読んで、今日の投稿を調査から表への記入まで進めてください。client.json の plan_approval が chat のときは、ネタをチャットに出して、選ばれたものだけ作ってください。それ以外は途中で質問せず、迷った点は自分で決めて理由を表に書いてください。表の「投稿OK」にチェックが付いた行は投稿の許可です。決まった時刻に表を見て、チェックの付いた行だけを投稿してください。"
