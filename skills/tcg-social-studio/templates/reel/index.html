<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card sourcing reel</title><style>
*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden;background:#11211b;font-family:'Segoe UI',Arial,sans-serif}#fit{width:1080px;height:1920px;position:absolute;transform-origin:0 0}#stage{position:absolute;inset:0;overflow:hidden;color:#fff;background:#12251e}.scene{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#27453a,#101e19)}.cream{background:#f3eddc;color:#182a21}.card{position:absolute;overflow:hidden;aspect-ratio:63/88;filter:drop-shadow(0 15px 18px #0005)}.card img{position:absolute;max-width:none}.brand{position:absolute;left:72px;top:92px;font-size:28px;letter-spacing:2px;z-index:30}.brand:before{content:'';display:inline-block;background:#ed5747;width:18px;height:18px;border-radius:50%;margin-right:14px}.title{position:absolute;left:72px;right:72px;top:208px;font-weight:900;font-size:78px;letter-spacing:-2px;line-height:1.1}.small-title{font-size:54px;line-height:1.23}.lime{color:#dcff73}.caption{position:absolute;left:72px;right:72px;bottom:280px;font-size:28px;text-align:center;line-height:1.5;letter-spacing:1px}.outline{position:absolute;border:7px solid #dcff73;border-radius:12px;box-shadow:0 0 0 3px #143422}.pocket{position:absolute;border:4px solid #6c796d;border-radius:9px;background:#152b23}.empty{position:absolute;border:6px dashed #dcff73;display:flex;align-items:center;justify-content:center;font-size:112px;color:#dcff73}.info{position:absolute;left:560px;right:85px;top:620px;line-height:1.4;font-size:42px;font-weight:800}.info small{font-size:25px;letter-spacing:2px;font-weight:500}.info hr{border:0;height:2px;background:#67806c;margin:26px 0}.badge{position:absolute;right:155px;top:380px;background:#dcff73;color:#142d21;border-radius:20px;padding:24px;font-size:56px;font-weight:900;transform:rotate(8deg)}.note{position:absolute;left:80px;right:80px;bottom:250px;font-size:30px;line-height:1.5;text-align:center}.progress{position:absolute;left:72px;right:72px;bottom:138px;background:#ffffff30;height:4px;z-index:30}.progress b{display:block;height:4px;background:#dcff73;transform-origin:left}.binder-bg{position:absolute;width:1080px;height:1920px;object-fit:fill}
</style></head><body><div id="fit"><main id="stage">
<section id="grid-scene" class="scene"><div id="grid"></div><div class="title small-title" id="hook"></div></section>
<section id="hero-scene" class="scene"><div class="title" id="hero-title"></div><div id="hero-host"></div><div class="caption" id="hero-label"></div></section>
<section id="binder-scene" class="scene cream"><div id="binder-bg"></div><div id="pockets"></div><div class="title small-title" id="binder-title" style="text-align:center;top:170px"></div></section>
<section id="enquiry-scene" class="scene"><div class="title small-title" id="enquiry-title" style="text-align:center"></div><div id="enquiry-host"></div></section>
<section id="send-scene" class="scene cream"><div class="title small-title" id="send-title"></div><div id="send-host"></div><div class="info" id="info"></div></section>
<section id="cta-scene" class="scene"><div id="cta-host"></div><div class="badge">DM</div><div id="cta-title" class="title" style="top:1100px;text-align:center"></div><div class="note" id="note"></div></section>
<div class="brand" id="brand"></div><div class="progress"><b id="bar"></b></div></main></div>
<script src="content.js"></script><script>
// 同じ時刻には必ず同じ画を表示。レンダラーは__seekを呼ぶ。
const $=id=>document.getElementById(id),B=C.segments,T=C.texts,clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-(1-clamp(x))**3;
if(!Array.isArray(C.cards)||!C.cards.length)throw Error('content.js: cardsに取得済みの商品を設定してください');
if(C.cards.length>12)throw Error('12枚超は一覧レイアウトを今回の参考に合わせて編集してください');
if(B.length!==8||B[0]!==0||B.some((v,i)=>!Number.isFinite(v)||(i&&v<=B[i-1])))throw Error('segmentsは0から単調増加する8個の秒数');
if(!Number.isInteger(C.selected)||!C.cards[C.selected])throw Error('selectedが不正');
const selected=C.cards[C.selected],escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lines(id,x){$(id).innerHTML=x.map(escape).join('<br>')}
function makeCard(p,parent,x,y,w){const d=document.createElement('div');d.className='card';d.style.left=x+'px';d.style.top=y+'px';d.style.width=w+'px';const im=document.createElement('img'),[cx,cy,cw,ch]=p.crop||[0,0,1,1];if(cw<=0||ch<=0||cx<0||cy<0||cx+cw>1.001||cy+ch>1.001)throw Error('crop invalid');im.src=p.src;im.alt=p.name;im.style.cssText=`width:${100/cw}%;height:${100/ch}%;left:${-cx/cw*100}%;top:${-cy/ch*100}%`;im.onload=()=>d.style.aspectRatio=(im.naturalWidth*cw)/(im.naturalHeight*ch);d.appendChild(im);$(parent).appendChild(d);return d;}
const cols=C.cards.length>4?3:Math.min(2,C.cards.length),rows=Math.ceil(C.cards.length/cols),cellW=Math.min((936-(cols-1)*28)/cols,(1230-(rows-1)*24)/rows*.71),cellH=cellW/.71,startX=(1080-(cols*cellW+(cols-1)*28))/2;
const gridCards=C.cards.map((p,i)=>makeCard(p,'grid',startX+i%cols*(cellW+28),425+Math.floor(i/cols)*(cellH+24),cellW));
const outline=document.createElement('div');outline.className='outline';$('grid').appendChild(outline);
const hero=makeCard(selected,'hero-host',215,510,650),enquiry=makeCard(selected,'enquiry-host',250,560,580),send=makeCard(selected,'send-host',90,620,420),end=makeCard(selected,'cta-host',310,350,460);
const slots=C.cards.map((p,i)=>C.binder.slots[i]||[(startX+i%cols*(cellW+28))/1080,(425+Math.floor(i/cols)*(cellH+24))/1920,cellW/1080]);
if(C.binder.background){const im=document.createElement('img');im.className='binder-bg';im.src=C.binder.background;im.alt='Illustrative binder background';$('binder-bg').appendChild(im)}
C.cards.forEach((p,i)=>{const [x,y,w]=slots[i];if(i===C.selected){const d=document.createElement('div');d.className='empty';d.id='empty';d.style.cssText=`left:${x*1080}px;top:${y*1920}px;width:${w*1080}px;height:${w*1080/.71}px`;d.textContent='+';$('pockets').appendChild(d)}else{if(!C.binder.background){const d=document.createElement('div');d.className='pocket';d.style.cssText=`left:${x*1080-5}px;top:${y*1920-5}px;width:${w*1080+10}px;height:${w*1080/.71+10}px`;$('pockets').appendChild(d)}makeCard(p,'pockets',x*1080,y*1920,w*1080)}});
$('brand').textContent=C.brand;lines('hook',T.hook);$('hook').lastChild.parentElement.style.lineHeight='1.05';lines('binder-title',T.binder);lines('enquiry-title',T.enquiry);lines('send-title',T.send);lines('cta-title',T.cta);lines('note',T.note);$('hero-label').textContent=[selected.name,selected.number,selected.language].filter(Boolean).join(' · ');
$('info').innerHTML='<small>CARD NAME</small><br>'+escape(selected.name)+'<hr><small>SET / NUMBER</small><br>'+escape(selected.number||'')+'<hr><small>LANGUAGE</small><br>'+escape(selected.language||'');
const scenes=['grid-scene','hero-scene','hero-scene','binder-scene','enquiry-scene','send-scene','cta-scene'];window.__dur=B[7];
function frame(t){t=Math.max(0,Math.min(t,B[7]));const k=Math.min(6,B.findIndex((b,i)=>i>0&&t<b)-1<0?6:B.findIndex((b,i)=>i>0&&t<b)-1),u=t-B[k],p=ease(u/.6);document.querySelectorAll('.scene').forEach(el=>el.style.display=el.id===scenes[k]?'block':'none');$('brand').style.color=k===3||k===5?'#1c3425':'#fff';$('bar').style.transform=`scaleX(${t/B[7]})`;
if(k===0){const i=u<B[1]*.6?Math.floor(u/.3)%C.cards.length:C.selected;gridCards.forEach((el,j)=>el.style.opacity=i===j?'1':'.76');const d=gridCards[i];outline.style.cssText=`left:${parseFloat(d.style.left)-7}px;top:${parseFloat(d.style.top)-7}px;width:${cellW+14}px;height:${d.getBoundingClientRect().height/(parseFloat($('fit').dataset.scale)||1)+14}px`;}
// v1.4: 同じカードの字幕切替では登場アニメーションをリセットしない。
if(k===1||k===2){const entrance=ease((t-B[1])/.6),zoom=k===2?ease(u/(B[3]-B[2])):0;$('hero-title').textContent=k===1?T.favourite:T.artwork;$('hero-label').style.opacity=k===2?'0':'1';hero.style.transformOrigin='50% 35%';hero.style.transform=`translateY(${30*(1-entrance)}px) scale(${.88+.12*entrance+.22*zoom}) rotate(${-3*entrance}deg)`;}
if(k===3)$('empty').style.opacity=.7+.3*Math.sin(u*4);
if(k===4)enquiry.style.transform=`scale(${.7+.3*p}) rotate(-3deg)`;
if(k===5){send.style.transform=`translateX(${-40*(1-p)}px) rotate(-5deg)`;$('info').style.opacity=p;}
if(k===6)end.style.transform=`rotate(${Math.sin(u)*1.5}deg)`;}
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);$('fit').dataset.scale=s;$('fit').style.transform=`scale(${s})`;$('fit').style.left=(innerWidth-1080*s)/2+'px';$('fit').style.top=(innerHeight-1920*s)/2+'px'}addEventListener('resize',fit);fit();let paused=false;window.__seek=t=>{paused=true;frame(t)};frame(0);const begin=performance.now();function play(now){if(!paused)frame(((now-begin)/1000)%B[7]);requestAnimationFrame(play)}requestAnimationFrame(play);
</script></body></html>
