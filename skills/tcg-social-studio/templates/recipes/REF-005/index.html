// v2.0: REF-005の実測配置。書体と背景アイコンは近似。自社の確認済み情報を渡す。
const R=window.RECIPE,C=window.CONTENT,slides=R.slides;const q=s=>document.querySelector(s);let index=0;
window.STORY={ratio:'custom',width:1088,height:1344,draft:!!C.draft};window.__dur=slides.length*3;window.__sceneStarts=slides.map((_,i)=>i*3);
window.__seek=t=>{index=Math.min(slides.length-1,Math.floor(Math.max(0,t)/3));const m=(C.comparisons||[])[index]||{},p=(C.products||[])[m.product??index]||{};
 q('.brand').textContent=C.brand||'';q('.site').textContent=C.site||'';q('.frame img').src=p.image||'';q('.name h1').textContent=p.name||'';q('.description').textContent=m.description||'';q('.number').textContent=m.number||'';q('.basis').textContent=m.basis||'';q('.footer .copy span').textContent=m.method||'';
 q('.left .amount').textContent=m.before_label||'';q('.right .amount').textContent=m.after_label||'';q('.left .date').textContent=m.before_date||'';q('.right .date').textContent=m.after_date||'';
 const delta=m.before>0?(m.after-m.before)/m.before*100:NaN,up=delta>0,color=up?'#87ddaa':'#fa7888';q('.change b').textContent=Number.isFinite(delta)?`${up?'▲ +':'▼ '}${Math.abs(delta).toFixed(1)}%`:'';q('.change b').style.color=color;
 const max=Math.max(m.before||1,m.after||1),y1=205-140*(m.before||0)/max,y2=205-140*(m.after||0)/max; q('#trend').setAttribute('d',`M170 ${y1}L750 ${y2}`);q('#trend').setAttribute('stroke',color);
 for(const [id,x,y,label,date] of [[1,170,y1,m.before_label,m.before_date],[2,750,y2,m.after_label,m.after_date]]){q('#p'+id).setAttribute('cx',x);q('#p'+id).setAttribute('cy',y);q('#v'+id).setAttribute('x',x);q('#v'+id).setAttribute('y',y-18);q('#v'+id).textContent=label||'';q('#d'+id).textContent=date||'';}
 q('.draft').style.display=C.draft?'block':'none';q('.draft').textContent='LAYOUT STUDY / NOT CURRENT PRICES / NOT FOR POSTING';return index*3;};
window.__check=()=>{const e=[],m=(C.comparisons||[])[index]||{};if(C.draft)e.push('DRAFT');if((C.comparisons||[]).length!==slides.length)e.push('Comparison count differs from source');if(slides.length!==9)e.push('REF-005 requires all 9 pages');if(!m.before||!m.after)e.push('Missing comparison amounts');if(m.price_basis!=='completed_sale'||m.axis!=='same_item_time')e.push('REF-005 labels require completed sales and time comparison');if(!C.brand||!C.site)e.push('Missing own brand/destination');for(const im of document.images)if(!im.complete||!im.naturalWidth)e.push('Missing product');for(const s of ['.name','.price.left','.price.right','.basis','.footer .copy']){const n=q(s);if(n.scrollWidth>n.clientWidth+2||n.scrollHeight>n.clientHeight+2)e.push('Overflow: '+s)}return e;};window.__seek(0);
