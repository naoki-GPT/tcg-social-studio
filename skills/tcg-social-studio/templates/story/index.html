<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TCG social story</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#101722;font-family:Arial,'Yu Gothic',sans-serif;color:#f7fafc}body{overflow:hidden}
#canvas{width:1080px;height:1350px;position:relative;overflow:hidden;background:#101722}
#canvas.vertical{height:1920px}#top{position:absolute;top:42px;left:60px;right:60px;display:flex;justify-content:space-between;font-size:24px;letter-spacing:2px;color:#adc0d4}#draft{color:#ffd86f}
.scene{display:none;position:absolute;inset:126px 60px 112px;flex-direction:column;gap:22px}.vertical .scene{inset:230px 64px 300px;gap:28px}.scene.active{display:flex}
h1{font-size:64px;line-height:1.25;letter-spacing:-2px;margin:0;overflow-wrap:anywhere;font-weight:900;padding-bottom:16px}h2{font-size:29px;line-height:1.3;color:#bfd1e4;margin:0;font-weight:400;overflow-wrap:anywhere}h1,h2,.label,.value,.note,.source{flex-shrink:0}
.items{display:grid;gap:22px;flex:1;min-height:0}.tile{background:#ffffff0b;border:1px solid #ffffff20;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:18px;min-height:0;min-width:0;overflow-wrap:anywhere}
.media{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center}.media img{width:100%;height:100%;object-fit:contain;display:block}.placeholder{font-size:28px;color:#9fb5cb;border:2px dashed #70869a;width:100%;height:100%;min-height:80px;display:grid;place-items:center}
.label{font-size:30px;line-height:1.18;font-weight:700}.value{font-size:35px;color:#91ead2;font-weight:700;line-height:1.15}
.compare .items{grid-template-columns:1fr 1fr}.compare .tile:first-child{border-color:#ea7378}.compare .value{font-size:52px;color:#fff3cd}.compare .tile:nth-child(2){border-color:#6aa6e5}
.grid .items{grid-template-columns:repeat(3,1fr)}.grid .label{font-size:26px}.grid .value{font-size:26px}
.table .items,.steps .items{grid-template-columns:1fr;align-content:center;flex:1}.table .tile,.steps .tile{flex-direction:row;align-items:center;padding:30px}.table .label,.steps .label{flex:1}.table .value,.steps .value{flex:1}.table .media,.steps .media{display:none}.steps .tile:before{content:attr(data-step);display:grid;place-items:center;background:#91ead2;color:#101722;font-weight:bold;font-size:34px;width:58px;height:58px;border-radius:50%;flex:none}
.cta{justify-content:center}.cta h1{font-size:86px}.cta h2{font-size:38px;line-height:1.5}.cta .items{display:none}
.note{font-size:25px;line-height:1.35;color:#dce6ef;margin-top:4px}.source{font-size:21px;color:#adbed0;line-height:1.25;overflow-wrap:anywhere}#progress{position:absolute;bottom:55px;left:60px;right:60px;display:flex;gap:8px}.vertical #progress{bottom:220px}.bar{height:5px;flex:1;background:#526679}.bar.current{background:#91ead2}
</style></head><body><main id="canvas"><div id="top"><span id="brand"></span><span id="draft"></span></div><div id="scenes"></div><div id="progress"></div></main>
<script src="content.js"></script><script>
// v1.4: 字幕の切替で同じ商品を再登場させない。価格は確定値のまま表示する。
const S=window.STORY;
if(!S||!Array.isArray(S.scenes)||!S.scenes.length)throw Error('Missing scenes');
if(!['4:5','9:16'].includes(S.ratio))throw Error('Invalid ratio');
const root=document.querySelector('#canvas');root.classList.toggle('vertical',S.ratio==='9:16');
document.querySelector('#brand').textContent=S.brand||'';document.querySelector('#draft').textContent=S.draft?'DRAFT / NOT FOR POSTING':'';
let end=0;const boundaries=[];
function el(tag,cls,text){const x=document.createElement(tag);x.className=cls;if(text)x.textContent=text;return x}
S.scenes.forEach((s,i)=>{
 if(!['hero','grid','compare','table','steps','cta'].includes(s.layout))throw Error('Unknown layout');
 if(!Number.isFinite(s.seconds)||s.seconds<1||s.seconds>30)throw Error('Invalid scene seconds');
 boundaries.push(end);end+=s.seconds;
 const panel=el('section','scene '+s.layout);panel.dataset.index=i;
 panel.append(el('h1','',s.heading),el('h2','',s.subheading));const items=el('div','items');
 const rows=s.items||[];if(s.layout==='compare'&&rows.length!==2)throw Error('Compare requires two columns');
 if(s.layout==='grid'&&rows.length>6)throw Error('Split grids larger than six items into more slides');
 rows.forEach((item,j)=>{const tile=el('div','tile');tile.dataset.step=j+1;const media=el('div','media');
  if(item.image){const img=el('img','');img.src=item.image;img.alt=item.label||'Product';media.append(img)}
  else if(['hero','grid','compare'].includes(s.layout))media.append(el('div','placeholder','PRODUCT IMAGE'));
  tile.append(media,el('div','label',item.label),el('div','value',item.value));items.append(tile)});
 panel.append(items);
 // v1.7: 出典・条件は内部記録へ。明示指定がある場合だけ注釈を表示する。
 if(S.showAnnotations===true)panel.append(el('div','note',s.note),el('div','source',s.source));
 document.querySelector('#scenes').append(panel);document.querySelector('#progress').append(el('div','bar'));
});
window.__dur=end;window.__sceneStarts=boundaries;
window.__seek=function(seconds){const t=Math.max(0,Math.min(end-0.00001,Number(seconds)||0));window.__time=t;let index=boundaries.length-1;while(index>0&&boundaries[index]>t)index--;
 document.querySelectorAll('.scene').forEach((node,i)=>{node.classList.toggle('active',i===index);node.style.transform='none';});
 document.querySelectorAll('.bar').forEach((node,i)=>node.classList.toggle('current',i===index));return index;};
window.__checkContinuity=function(){
 const current=window.__time,errors=[];
 const sample=t=>{window.__seek(t);return [...document.querySelectorAll('.scene.active .media img')].map(x=>{const r=x.getBoundingClientRect();return {key:x.getAttribute('src'),rect:[r.x,r.y,r.width,r.height],visible:r.width>0&&r.height>0}}).filter(x=>x.visible)};
 for(const t of boundaries.slice(1)){const before=sample(t-1/60),after=sample(t+1/60);for(const x of after){const old=before.find(v=>v.key===x.key);if(old&&Math.max(...x.rect.map((v,j)=>Math.abs(v-old.rect[j])))>2)errors.push('Same product jumps at '+t+'s: '+x.key)}}
 window.__seek(current);return errors;
};
window.__check=function(){const errors=[];if(S.draft)errors.push('DRAFT');if(/EDIT:|YOUR SHOP/.test(JSON.stringify(S)))errors.push('Unfilled copy');
 for(const image of document.images)if(!image.complete||!image.naturalWidth)errors.push('Missing image');
 for(const scene of S.scenes)if(['hero','grid','compare'].includes(scene.layout)&&(!scene.items?.length||scene.items.some(x=>!x.image)))errors.push('Missing product image');
 const active=document.querySelector('.scene.active');for(const node of active.querySelectorAll('h1,h2,.label,.value,.note,.source,.tile'))if(node.scrollHeight>node.clientHeight+2||node.scrollWidth>node.clientWidth+2)errors.push('Text overflow: '+(node.className||node.tagName)+' '+node.scrollWidth+'/'+node.clientWidth+' '+node.scrollHeight+'/'+node.clientHeight);
 if(active.scrollHeight>active.clientHeight+2)errors.push('Scene overflow');errors.push(...window.__checkContinuity());return [...new Set(errors)];};
window.__seek(Number(new URLSearchParams(location.search).get('t')||0));
</script></body></html>
